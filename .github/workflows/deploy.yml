name: Deploy ML Service to VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
    - name: Pull latest code
      run: |
        cd ~/CP25NK2-ML-Service
        git fetch origin
        git reset --hard origin/main

    - name: Build Docker image
      run: docker build -t catbnb-ml ~/CP25NK2-ML-Service

    - name: Deploy container
      run: |
        docker rm -f catbnb-ml || true
        docker run -d \
          --name catbnb-ml \
          --network catbnb-network \
          --restart always \
          --env-file ~/CP25NK2-ML-Service/.env \
          -p 5000:5000 \
          catbnb-ml

    - name: Show logs
      run: docker logs --tail 20 catbnb-ml
